
{% extends 'blog/base.html' %}
{% block content %}
  <div class="post">
    {% if post.published_date %}<div class="date">{{ post.published_date }}</div>{% endif %}
    <h1>{{ post.title }}</h1>
    {% if post.image %}
    <img src="{{ post.image.url }}" alt="{{ post.title }}" style="max-width:100%;border-radius:8px;margin:8px 0;">
    {% endif %}
    <p>{{ post.text|linebreaksbr }}</p>
    {% if user.is_authenticated %}
      <a class="btn btn-default" href="{% url 'post_edit' pk=post.pk %}"><span class="glyphicon glyphicon-pencil"></span></a>
    {% endif %}
  </div>
{% endblock %}
