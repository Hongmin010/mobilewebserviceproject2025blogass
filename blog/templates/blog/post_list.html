
{% extends 'blog/base.html' %}
{% block content %}
  {% for post in posts %}
    <div class="post">
      <div class="date">{{ post.published_date }}</div>
      <h1><a href="{% url 'post_detail' pk=post.pk %}">{{ post.title }}</a></h1>
      {% if post.image %}
      <img src="{{ post.image.url }}" alt="{{ post.title }}" style="max-width:100%;border-radius:8px;margin:8px 0;">
      {% endif %}
      <p>{{ post.text|linebreaksbr }}</p>
    </div>
  {% empty %}
    <p>게시물이 없습니다. 우측 상단 + 버튼으로 작성하거나, REST API <code>/api_root/Post/</code>로 생성하세요.</p>
  {% endfor %}
{% endblock %}
